# Sized for the dev container, where the Gradle daemon, the Kotlin compile daemon
# and two language servers share one VM. Raise these if you build on the host and
# have memory to spare.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx1g

# Single-module build, so parallel execution buys nothing and only costs memory.
org.gradle.caching=true

kotlin.code.style=official
libraryRevision=1
