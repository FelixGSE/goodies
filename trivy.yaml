# Read by `make scan` (trivy fs .): HIGH and CRITICAL findings fail the scan,
# fixed or not. Dependencies come from gradle.lockfile (`make lock`); trivy
# drops test-only ones unless pkg.include-dev-deps is set.
severity:
  - HIGH
  - CRITICAL
exit-code: 1
ignorefile: .trivyignore.yaml
db:
  no-progress: true
pkg:
  include-dev-deps: true
scan:
  scanners:
    - vuln
    - secret
  skip-dirs:
    - build
    - .gradle
    - bin
    - out
