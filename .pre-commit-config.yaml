# Run by prek (https://github.com/j178/prek), a drop-in for pre-commit.
# Install once per clone or worktree: `make hooks`. CI runs the same hooks on
# every pull request, so skipping them locally only moves the failure.
# Local hooks are shell scripts in scripts/ or ./gradlew tasks; the workflow
# linters are remote hooks pinned to a commit, their toolchains managed by prek.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: hygiene
        name: whitespace, line endings, final newline, merge markers, file size
        entry: scripts/hygiene.sh
        language: script
        types: [text]
      - id: branch-name
        name: branch name follows <type>/<slug>, never main
        entry: scripts/lint-branch.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: commit-message
        name: commit message follows Conventional Commits
        entry: scripts/lint-commit-msg.sh
        language: script
        stages: [commit-msg]
      - id: ktlint
        name: ktlint, official style (make fmt fixes)
        entry: ./gradlew --quiet ktlintCheck
        language: system
        stages: [pre-commit]
        files: \.kts?$|^\.editorconfig$
        pass_filenames: false
      - id: detekt
        name: detekt against its baselines
        entry: ./gradlew --quiet detektMain detektTest
        language: system
        stages: [pre-commit]
        files: \.kts?$|^config/detekt/
        pass_filenames: false
      - id: detekt-baseline
        name: detekt baselines only shrink
        entry: scripts/lint-detekt-baseline.sh
        language: script
        stages: [pre-commit]
        files: ^config/detekt/baseline-(main|test)\.xml$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-commit]
        files: ^\.github/workflows/

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: d25b2b1dc80689fb633f21f6978bba69871181d3 # v1.31.0
    hooks:
      - id: zizmor
        stages: [pre-commit]
        files: ^\.github/(workflows|actions)/
